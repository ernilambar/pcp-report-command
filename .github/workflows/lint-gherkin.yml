name: Gherkin Linting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.feature'
      - '.gherkin-lintrc'
      - '.github/gherkin-lint/**'
      - '.github/workflows/lint-gherkin.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.feature'
      - '.gherkin-lintrc'
      - '.github/gherkin-lint/**'
      - '.github/workflows/lint-gherkin.yml'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gherkin-lint:
    name: Lint Gherkin Feature files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4

      - name: Install Gherkin Refine
        run: npm ci --prefix .github/gherkin-lint --ignore-scripts --no-fund

      - name: Run lint
        run: .github/gherkin-lint/node_modules/.bin/gherkin-lint features
